# Plasmonk Starship prompt: Ryoku's "pill" layout (GPL-3.0, github.com/Ryoku-dev/ryoku),
# with the palette rendered by matugen from the active Plasmonk palette. Regenerated by
# `plasmonk apply`; edits here are overwritten.
add_newline = false
palette = "plasmonk"

# floating pill layout
format = """
$directory$git_branch$cmd_duration
$character"""

[palettes.plasmonk]
# pill backgrounds: dark tints of the palette
dir_bg = "{{palettes.neutral_variant._20.hex}}"
git_bg = "{{palettes.secondary._20.hex}}"
time_bg = "{{palettes.tertiary._20.hex}}"

# foregrounds: bright palette accents
dir_fg = "{{palettes.primary._80.hex}}"
git_fg = "{{palettes.secondary._80.hex}}"
time_fg = "{{palettes.tertiary._80.hex}}"
crimson = "{{palettes.error._70.hex}}"

[directory]
style = "fg:dir_fg bg:dir_bg bold"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:crimson bg:dir_bg bold"
# Nerd Font half-circles = the pill caps
format = "[](fg:dir_bg)[󰉋 $path ]($style)[$read_only]($read_only_style)[](fg:dir_bg) "

[git_branch]
symbol = "󰊢 "
style = "fg:git_fg bg:git_bg bold"
format = "[](fg:git_bg)[$symbol$branch ]($style)[](fg:git_bg) "

[cmd_duration]
min_time = 500
style = "fg:time_fg bg:time_bg bold"
format = "[](fg:time_bg)[󰔚 $duration ]($style)[](fg:time_bg) "

[character]
# lambda, not a chevron
success_symbol = "[λ ](bold fg:dir_fg)"
error_symbol = "[λ ](bold fg:crimson)"

[package]
disabled = true
